<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="aiPlatformTitle">
  <title id="aiPlatformTitle">Abstract illustration of connected AI agent nodes feeding a workflow dashboard</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4F2"/>
      <stop offset="100%" stop-color="#FDEEE9"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A6E"/>
      <stop offset="100%" stop-color="#FF534A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bgGrad)"/>

  <!-- connecting lines (agent graph) -->
  <g stroke="#FF534A" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M120 150 L300 110"/>
    <path d="M120 150 L260 240"/>
    <path d="M120 150 L150 320"/>
    <path d="M300 110 L470 160"/>
    <path d="M300 110 L260 240"/>
    <path d="M260 240 L470 160"/>
    <path d="M260 240 L380 330"/>
    <path d="M150 320 L380 330"/>
    <path d="M470 160 L520 300"/>
    <path d="M380 330 L520 300"/>
  </g>

  <!-- agent / workflow nodes -->
  <g>
    <circle cx="120" cy="150" r="22" fill="url(#nodeGrad)"/>
    <circle cx="300" cy="110" r="16" fill="#FF534A" fill-opacity="0.85"/>
    <circle cx="470" cy="160" r="20" fill="url(#nodeGrad)"/>
    <circle cx="260" cy="240" r="26" fill="#FF534A"/>
    <circle cx="150" cy="320" r="14" fill="#FF534A" fill-opacity="0.7"/>
    <circle cx="380" cy="330" r="18" fill="url(#nodeGrad)"/>
    <circle cx="520" cy="300" r="15" fill="#FF534A" fill-opacity="0.8"/>
  </g>

  <!-- dashboard card (governance / usage UI) -->
  <g>
    <rect x="200" y="360" width="280" height="90" rx="10" fill="#ffffff" stroke="#212529" stroke-opacity="0.08"/>
    <rect x="222" y="382" width="90" height="8" rx="4" fill="#212529" fill-opacity="0.75"/>
    <rect x="222" y="400" width="140" height="6" rx="3" fill="#212529" fill-opacity="0.25"/>
    <rect x="222" y="414" width="110" height="6" rx="3" fill="#212529" fill-opacity="0.25"/>

    <!-- mini bar chart -->
    <rect x="350" y="414" width="10" height="16" fill="#FF534A"/>
    <rect x="366" y="406" width="10" height="24" fill="#FF534A" fill-opacity="0.8"/>
    <rect x="382" y="396" width="10" height="34" fill="#FF534A" fill-opacity="0.6"/>
    <rect x="398" y="402" width="10" height="28" fill="#FF534A" fill-opacity="0.8"/>
    <rect x="414" y="390" width="10" height="40" fill="#FF534A"/>
    <rect x="430" y="408" width="10" height="22" fill="#FF534A" fill-opacity="0.7"/>
    <rect x="446" y="398" width="10" height="32" fill="#FF534A" fill-opacity="0.9"/>
  </g>
</svg>
